<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>マナビースト ～光と闇のかけら～</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0a0a12;overflow:hidden;
    font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #game{image-rendering:pixelated;background:#000;
    box-shadow:0 0 0 3px #2b2b44, 0 0 40px #000a;}
  #hint{position:fixed;left:0;right:0;bottom:4px;text-align:center;color:#556;
    font-size:12px;letter-spacing:1px;pointer-events:none;user-select:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="640" height="480"></canvas></div>
<div id="hint">方向キー/WASD=移動　Z or Enter=決定　X or Esc=キャンセル・メニュー　Shift=ダッシュ</div>

<!-- ?v= はキャッシュ対策。JSを更新したら数字を上げること -->
<script src="js/sprites.js?v=2"></script>
<script src="js/data.js?v=2"></script>
<script src="js/species.js?v=2"></script>
<script src="js/maps.js?v=2"></script>
<script src="js/audio.js?v=2"></script>
<script src="js/core.js?v=2"></script>
<script src="js/ui.js?v=2"></script>
<script src="js/battle.js?v=2"></script>
<script src="js/overworld.js?v=2"></script>
<script src="js/main.js?v=2"></script>
</body>
</html>
